version: 2
updates:
  # Check for python dependencies in analytics package
  - package-ecosystem: "pip"
    directory: "/packages/analytics"
    schedule:
      interval: "quarterly"
    open-pull-requests-limit: 10
    versioning-strategy: auto

  # Check for npm dependencies in web package
  - package-ecosystem: "npm"
    directory: "/packages/web"
    schedule:
      interval: "quarterly"
    open-pull-requests-limit: 10
    versioning-strategy: auto
    ignore:
      # eslint-config-next 16.2.x still pulls ESLint plugins whose peer ranges
      # stop at ESLint 9.
      - dependency-name: "eslint"
        update-types:
          - "version-update:semver-major"

  # Check for npm dependencies in cms package
  - package-ecosystem: "npm"
    directory: "/packages/cms"
    schedule:
      interval: "quarterly"
    open-pull-requests-limit: 10
    versioning-strategy: auto
    ignore:
      # Strapi 5.44.x and the SEO plugin require React 18 / React Router 6.
      - dependency-name: "react"
        update-types:
          - "version-update:semver-major"
      - dependency-name: "@types/react"
        update-types:
          - "version-update:semver-major"
      - dependency-name: "react-dom"
        update-types:
          - "version-update:semver-major"
      - dependency-name: "@types/react-dom"
        update-types:
          - "version-update:semver-major"
      - dependency-name: "react-router-dom"
        update-types:
          - "version-update:semver-major"
      # Strapi's react-intl / formatjs chain currently peers on TypeScript 5.
      - dependency-name: "typescript"
        update-types:
          - "version-update:semver-major"

  # Check for updates to Docker in web package
  - package-ecosystem: "docker"
    directory: "/packages/web"
    schedule:
      interval: "quarterly"
    open-pull-requests-limit: 5

  # Check for updates to Docker in cms package
  - package-ecosystem: "docker"
    directory: "/packages/cms"
    schedule:
      interval: "quarterly"
    open-pull-requests-limit: 5

  # Check for updates to GitHub Actions
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "quarterly"
    open-pull-requests-limit: 5
